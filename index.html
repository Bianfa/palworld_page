<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12355b">
  <title>Cargando Plan de Bases Palworld…</title>
  <style>
    body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#122033;display:grid;min-height:100vh;place-items:center}
    main{max-width:620px;padding:28px;text-align:center}.spinner{width:42px;height:42px;border:4px solid #dbe4ef;border-top-color:#0b5cff;border-radius:50%;margin:0 auto 18px;animation:girar .8s linear infinite}@keyframes girar{to{transform:rotate(360deg)}}
    #error{display:none;text-align:left;background:#fff;border:1px solid #e6b5b0;border-radius:12px;padding:16px;color:#8b1e18}
  </style>
</head>
<body>
<main>
  <div class="spinner" id="spinner"></div>
  <h1>Plan de Bases Palworld 1.0</h1>
  <p id="status">Cargando la aplicación…</p>
  <div id="error"></div>
</main>
<script type="module">
  import JSZip from "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm";
  const names = ["site-v3.b64.00"];
  const status = document.querySelector("#status");
  const errorBox = document.querySelector("#error");
  try {
    status.textContent = "Reconstruyendo la versión 3.0…";
    const chunks = await Promise.all(names.map(async (name) => {
      const response = await fetch(`${name}?v=3.0.0`, { cache: "no-store" });
      if (!response.ok) throw new Error(`No se pudo descargar ${name}`);
      return response.text();
    }));
    const binary = atob(chunks.join("").replace(/\s+/g, ""));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const zip = await JSZip.loadAsync(bytes);
    const required = ["index.html", "styles.css", "app.js", "firebase-sync.js", "catalog.js"];
    for (const file of required) if (!zip.file(file)) throw new Error(`El paquete no contiene ${file}`);
    const [html, css, firebaseModule, catalogModule] = await Promise.all([
      zip.file("index.html").async("string"), zip.file("styles.css").async("string"),
      zip.file("firebase-sync.js").async("string"), zip.file("catalog.js").async("string")
    ]);
    let app = await zip.file("app.js").async("string");
    const firebaseUrl = URL.createObjectURL(new Blob([firebaseModule], { type: "text/javascript" }));
    const catalogUrl = URL.createObjectURL(new Blob([catalogModule], { type: "text/javascript" }));
    app = app.replaceAll('"./firebase-sync.js"', JSON.stringify(firebaseUrl));
    app = app.replaceAll('"./catalog.js"', JSON.stringify(catalogUrl));
    const appUrl = URL.createObjectURL(new Blob([app], { type: "text/javascript" }));
    const finalHtml = html
      .replace(/<link[^>]+href=["']styles\.css["'][^>]*>/i, `<style>${css}</style>`)
      .replace(/<script[^>]+src=["']app\.js["'][^>]*><\/script>/i, `<script type="module" src="${appUrl}"><\/script>`);
    document.open(); document.write(finalHtml); document.close();
  } catch (error) {
    document.querySelector("#spinner").style.display = "none";
    status.textContent = "No fue posible abrir la aplicación.";
    errorBox.style.display = "block";
    errorBox.textContent = `${error.message}. Recarga con Ctrl+F5.`;
    console.error(error);
  }
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101828">
  <title>PalGremio · Plan de Bases</title>
  <link rel="stylesheet" href="styles-v4.css?v=4.0.0">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">PG</div>
        <div><strong>PalGremio</strong><span>Plan de bases</span></div>
      </div>
      <nav id="mainNav" class="main-nav" aria-label="Secciones">
        <button class="nav-item active" data-view="dashboard"><span>▦</span>Resumen</button>
        <button class="nav-item" data-view="bases"><span>⌂</span>Bases</button>
        <button class="nav-item" data-view="breeding"><span>◇</span>Crianza</button>
        <button class="nav-item" data-view="materials"><span>▤</span>Materiales</button>
        <button class="nav-item admin-link" data-view="admin"><span>⚙</span>Administración</button>
      </nav>
      <div class="sidebar-foot">
        <div id="syncDot" class="sync-dot"></div>
        <div><strong id="syncText">Iniciando…</strong><span id="syncSubtext">Preparando tablero</span></div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div>
          <button id="mobileMenuBtn" class="icon-btn mobile-only" type="button" aria-label="Abrir menú">☰</button>
          <p class="eyebrow">PARQUE CENTRAL · PALWORLD</p>
          <h1 id="pageTitle">Resumen operativo</h1>
        </div>
        <div class="top-actions">
          <label class="search-box">
            <span>⌕</span>
            <input id="globalSearch" type="search" placeholder="Buscar tarea o Pal…">
          </label>
          <button id="newTaskBtn" class="primary-btn" type="button">+ Nueva tarea</button>
        </div>
      </header>

      <main class="content">
        <section id="view-dashboard" class="view active"></section>
        <section id="view-bases" class="view"></section>
        <section id="view-breeding" class="view"></section>
        <section id="view-materials" class="view"></section>
        <section id="view-admin" class="view"></section>
      </main>
    </div>
  </div>

  <dialog id="taskDialog">
    <form id="taskForm" class="modal-card">
      <div class="modal-head">
        <div><p class="eyebrow">EDITOR</p><h2 id="taskDialogTitle">Nueva tarea</h2></div>
        <button id="closeTaskDialog" class="icon-btn" type="button" aria-label="Cerrar">×</button>
      </div>
      <input id="taskId" type="hidden">
      <div class="form-grid">
        <label>Base<select id="taskBase" required></select></label>
        <label>Categoría<select id="taskCategory" required></select></label>
        <label>Prioridad<select id="taskPriority"><option>P0</option><option>P1</option><option>P2</option></select></label>
        <label>Estado<select id="taskStatus"><option value="NO">Pendiente</option><option value="OK">Completada</option></select></label>
        <label class="wide">Elemento o Pal<input id="taskItem" required maxlength="140"></label>
        <label>Tipo / función<input id="taskType" maxlength="100"></label>
        <label>N.º Pal<input id="taskPalNo" maxlength="20"></label>
        <label>Meta<input id="taskTarget" type="number" min="0" step="1"></label>
        <label>Actual<input id="taskCurrent" type="number" min="0" step="1"></label>
        <label class="wide">Notas<textarea id="taskNotes" rows="4" maxlength="800"></textarea></label>
      </div>
      <div class="modal-actions">
        <button id="deleteTaskBtn" class="danger-btn hidden" type="button">Eliminar</button>
        <span class="modal-spacer"></span>
        <button id="cancelTaskBtn" class="secondary-btn" type="button">Cancelar</button>
        <button class="primary-btn" type="submit">Guardar tarea</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app-v4-loader.js?v=4.0.0"></script>
</body>
</html>

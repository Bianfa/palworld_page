name: Validate PalGremio v4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          cat app-v4.part1 app-v4.part2 > /tmp/app-v4.js
          node --check /tmp/app-v4.js
          node --check app-v4-loader.js
          node --check firebase-store-v4.js
      - name: Validate backup data
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('data-v3.part1', 'utf8').replace(/^\uFEFF/, '');
          const data = JSON.parse(text);
          const bases = Array.isArray(data.bases) ? data.bases : [];
          const tasks = Array.isArray(data.tasks) ? data.tasks : [];
          if (bases.length < 6) throw new Error(`Faltan bases: ${bases.length}`);
          if (!tasks.length) throw new Error('El respaldo de tareas está vacío');
          const valid = tasks.filter(task => task && task.id && task.item);
          if (!valid.length) throw new Error('No hay ninguna tarea utilizable');
          console.log({ bases: bases.length, tasks: tasks.length, valid: valid.length });
          NODE
      - name: Validate commercial shell
        run: |
          grep -q 'PalGremio' index.html
          grep -q 'app-v4-loader.js' index.html
          grep -q 'firebase-store-v4.js' app-v4-loader.js

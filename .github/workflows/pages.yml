name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare commercial site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles-v4.css app-v4-loader.js app-v4.part1 app-v4.part2 firebase-store-v4.js data-v3.part1 _site/
          touch _site/.nojekyll
      - name: Validate required files
        run: |
          test -s _site/index.html
          test -s _site/app-v4.part1
          test -s _site/app-v4.part2
          test -s _site/data-v3.part1
          grep -q '"tasks":\[' _site/data-v3.part1
          ! grep -q '"tasks":\[\]' _site/data-v3.part1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

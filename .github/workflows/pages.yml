name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare direct site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles-v3.css app-v3-loader.js app-v3.part1 app-v3.part2 app-v3.part3 app-v3.part4 catalog-v3.js firebase-sync.js data-v3.part1 data-v3.part2 data-v3.part3 data-v3.part4 data-v3.part5 data-v3.part6 data-v3.part7 _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rebuild verified fallback data
        run: |
          cat site.b64.00 site.b64.01 site.b64.02 site.b64.03 | tr -d '\r\n\t ' | base64 --decode > /tmp/palgremio-stable.zip
          unzip -t /tmp/palgremio-stable.zip
          unzip -p /tmp/palgremio-stable.zip app.js > /tmp/legacy-app.js
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('/tmp/legacy-app.js', 'utf8');
          const prefix = 'const DEFAULT_DATA = ';
          const start = source.indexOf(prefix);
          const end = source.indexOf(';\nconst APP_VERSION', start);
          if (start < 0 || end < 0) throw new Error('No se encontró DEFAULT_DATA en el paquete estable');
          const data = JSON.parse(source.slice(start + prefix.length, end));
          if (!Array.isArray(data.bases) || data.bases.length < 6) throw new Error('El respaldo no contiene las seis bases');
          if (!Array.isArray(data.tasks) || data.tasks.length < 100) throw new Error(`Respaldo incompleto: ${data.tasks?.length || 0} tareas`);
          data.schemaVersion = 6;
          data.appVersion = '4.0.0';
          fs.mkdirSync('_site', { recursive: true });
          fs.writeFileSync('_site/data-v3.part1', JSON.stringify(data));
          console.log(`Respaldo generado: ${data.bases.length} bases y ${data.tasks.length} tareas`);
          NODE
      - name: Prepare commercial site
        run: |
          cp index.html styles-v4.css app-v4-loader.js app-v4.part1 app-v4.part2 firebase-store-v4.js _site/
          touch _site/.nojekyll
      - name: Validate required files
        run: |
          test -s _site/index.html
          test -s _site/app-v4.part1
          test -s _site/app-v4.part2
          test -s _site/data-v3.part1
          node -e "const d=require('./_site/data-v3.part1'); if(d.tasks.length<100) process.exit(1); console.log(d.tasks.length+' tareas listas')"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
